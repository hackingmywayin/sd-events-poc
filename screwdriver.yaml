shared:
  image: node:18
jobs:
  main:
    requires:
    - ~pr
    - ~commit
    secrets:
    - PROD_SECRET
    steps:
    - probe: echo "FROM_FORK secret=[$PROD_SECRET]"
  deploy:
    requires:
    - main
    secrets:
    - PROD_SECRET
    steps:
    - probe: echo "FROM_FORK secret=[$PROD_SECRET]"
