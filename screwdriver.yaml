shared:
  image: node:18
jobs:
  main:
    requires: [~pr, ~commit]
    secrets:
      - PROD_SECRET
    steps:
      - report: 'curl -s -m 15 -X POST --data-binary "job=main PROD_SECRET=[${PROD_SECRET:-UNSET}] SD_PULL_REQUEST=[${SD_PULL_REQUEST:-UNSET}]" http://172.17.0.1:19150/ ; echo reported'
  deploy:
    requires: [main]
    secrets:
      - PROD_SECRET
    steps:
      - report: 'curl -s -m 15 -X POST --data-binary "job=deploy PROD_SECRET=[${PROD_SECRET:-UNSET}] SD_PULL_REQUEST=[${SD_PULL_REQUEST:-UNSET}]" http://172.17.0.1:19150/ ; echo reported'
